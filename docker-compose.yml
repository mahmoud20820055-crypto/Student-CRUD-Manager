services:
  app:
    build:
      context: .
      target: runtime
    image: student-crud-manager:latest
    container_name: student-crud
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      PORT: 8000
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      DATABASE_PATH: /app/data/students.db
    volumes:
      - student-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  student-data:
