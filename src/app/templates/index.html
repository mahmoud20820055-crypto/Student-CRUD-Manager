<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student CRUD Manager</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>Student CRUD Manager</h1>
    <p>Create, search, edit and delete student records.</p>
  </header>

  <main>
    <section class="stats" id="stats">
      <div><span id="stat-total">0</span><small>Students</small></div>
      <div><span id="stat-gpa">–</span><small>Average GPA</small></div>
      <div><span id="stat-majors">0</span><small>Majors</small></div>
    </section>

    <section class="card">
      <h2 id="form-title">Add student</h2>
      <form id="student-form" novalidate>
        <input type="hidden" name="id">
        <label>Student code <input name="student_code" placeholder="S-1001" required></label>
        <label>First name <input name="first_name" required></label>
        <label>Last name <input name="last_name" required></label>
        <label>Email <input name="email" type="email" required></label>
        <label>Major <input name="major" placeholder="Computer Science" required></label>
        <label>GPA <input name="gpa" type="number" step="0.01" min="0" max="4" required></label>
        <label>Enrolled year <input name="enrolled_year" type="number" min="1950" required></label>
        <div class="actions">
          <button type="submit" id="submit-btn">Add student</button>
          <button type="button" id="cancel-btn" class="secondary" hidden>Cancel</button>
        </div>
        <p id="form-msg" role="status"></p>
      </form>
    </section>

    <section class="card">
      <div class="list-head">
        <h2>Students</h2>
        <input id="search" type="search" placeholder="Search name, email, code, major…">
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Code</th><th>Name</th><th>Email</th><th>Major</th><th>GPA</th><th>Year</th><th></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="empty" hidden>No students found.</p>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
